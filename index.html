    <!-- Critical paint: theme + background before anything renders (no flash) -->
    <script>
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
        /* var() keeps this in sync with the theme, unlike a hard-coded colour */
        document.documentElement.style.background = 'var(--boot-bg)'
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <style>
      html {
        background: var(--bg, #08090b);
      }
      /* Boot curtain — replaced by the React preloader on mount */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: var(--bg, #08090b);
      }
    </style>
