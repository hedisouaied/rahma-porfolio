name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; cancel stale runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Project sites are served from https://<user>.github.io/<repo>/, so the
    # built site needs that subpath as its base. Set the repository variable
    # BASE_PATH to "/" first if a custom domain is ever attached.
    # Job level so the build and the verification step can never disagree.
    env:
      VITE_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the built base path
        run: |
          set -euo pipefail
          base="${VITE_BASE_PATH:?VITE_BASE_PATH must be defined at job level}"
          echo "expected base: $base"
          fail() { echo "FAIL: $1"; exit 1; }

          # The base is a URL prefix, not a dist directory: assets stay at dist/assets.
          grep -q "href=\"${base}assets/" dist/index.html \
            || grep -q "src=\"${base}assets/" dist/index.html \
            || fail "dist/index.html does not reference ${base}assets/"

          # The CV link is built from import.meta.env.BASE_URL at build time, so the
          # base must be inlined as a literal and never left unresolved.
          grep -q -- "\"${base}\"" dist/assets/*.js \
            || fail "base ${base} was not inlined into the JS bundle"
          if grep -q "import.meta.env" dist/assets/*.js; then
            fail "unresolved import.meta.env left in the bundle"
          fi

          test -f dist/cv/Rahma-Jlassi-CV.pdf || fail "dist/cv/Rahma-Jlassi-CV.pdf is missing"
          test -f dist/og-image.png || fail "dist/og-image.png is missing"
          test -f dist/.nojekyll || fail "dist/.nojekyll is missing"

          # The social card URL must be absolute for crawlers; meta[content] is not
          # rewritten by Vite, so it lives in index.html as a full URL.
          grep -q 'og:image' dist/index.html || fail "og:image missing"
          grep -qE 'og:image"?[[:space:]]*$|content="https://[^"]+og-image\.png"' dist/index.html \
            || fail "og:image is not an absolute https URL"

          echo "OK: base, CV, og-image, .nojekyll all present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4