name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; cancel stale runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Project sites are served from https://<user>.github.io/<repo>/, so the
      # built site needs that subpath as its base. Set the repository variable
      # BASE_PATH to "/" first if a custom domain is ever attached.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Verify the built base path
        run: |
          set -euo pipefail
          base="${VITE_BASE_PATH}"
          echo "expected base: $base"
          # The base is a URL prefix, not a dist directory: assets stay at dist/assets.
          grep -q "href=\"${base}assets/" dist/index.html \
            || grep -q "src=\"${base}assets/" dist/index.html \
            || { echo "FAIL: dist/index.html does not reference ${base}assets/"; exit 1; }
          # The CV link is built from import.meta.env.BASE_URL at build time, so the
          # base must be inlined as a literal in the JS bundle (not left unresolved).
          grep -q -- "\"${base}\"" dist/assets/*.js \
            || { echo "FAIL: base ${base} was not inlined into the JS bundle"; exit 1; }
          grep -q "import.meta.env" dist/assets/*.js \
            && { echo "FAIL: unresolved import.meta.env left in the bundle"; exit 1; }
          test -f dist/cv/Rahma-Jlassi-CV.pdf \
            || { echo "FAIL: dist/cv/Rahma-Jlassi-CV.pdf is missing"; exit 1; }
          test -f dist/og-image.png \
            || { echo "FAIL: dist/og-image.png is missing"; exit 1; }
          test -f dist/.nojekyll \
            || { echo "FAIL: dist/.nojekyll is missing"; exit 1; }
          echo "OK: base, CV, og-image and .nojekyll all present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4